server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/solaraivle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:aivle}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true   # Hibernate 테이블 생성 완료 후 data.sql 실행
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:changeme@gmail.com}
    password: ${MAIL_PASSWORD:changeme-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-please-override-in-real-env-32bytes-min}
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 86400000
  refresh-token-remember-me-validity-ms: 1209600000

google:
  client-id: ${GOOGLE_CLIENT_ID:changeme.apps.googleusercontent.com}
  client-secret: ${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}

terms:
  version: "1.0"

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  board-storage:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    prefix: ${AWS_S3_BOARD_PREFIX:board-attachments}
  admin-email: ${ADMIN_EMAIL:changeme@gmail.com}

  idle-land-import:
    s3-bucket: ${IDLE_LAND_IMPORT_S3_BUCKET:${AWS_S3_BUCKET:}}
    s3-key: ${IDLE_LAND_IMPORT_S3_KEY:idle-land/데이터_전체_최종보정.csv}

ai:
  server:
    # AI 분석 서버 나중에 수정하기
    base-url: ${AI_SERVER_URL:http://localhost:9000}
    analyze-path: ${AI_SERVER_ANALYZE_PATH:/analyze}
vision:
  ai:
    url: ${VISION_AI_URL:http://localhost:8001/api/v1/vision/shade-analysis}
fastapi:
  url: http://localhost:8000
ml:
  server:
    # Ranking_ML FastAPI 서버 (유휴부지 예측·랭킹·SHAP)
    base-url: ${ML_SERVER_URL:http://localhost:8002}
policy:
  agent:
    # 정책·자금지원 추천 AI Agent (AI_agent 레포) FastAPI 서버
    base-url: ${POLICY_AGENT_URL:http://localhost:8003}
    internal-api-key: ${POLICY_AGENT_INTERNAL_API_KEY:}
pvgis:
  enabled: ${PVGIS_ENABLED:true}
  base-url: ${PVGIS_BASE_URL:https://re.jrc.ec.europa.eu/api/v5_3}
  system-loss-percent: ${PVGIS_SYSTEM_LOSS_PERCENT:14}
  connect-timeout-ms: ${PVGIS_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${PVGIS_READ_TIMEOUT_MS:7000}
